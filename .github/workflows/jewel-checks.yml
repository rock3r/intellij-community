name: Jewel Checks

on:
  pull_request:
    paths:
      - "platform/jewel/**"
      - ".github/workflows/jewel-checks.yml"

jobs:
  spectre_tests_windows:
    name: Jewel Spectre tests (Windows) [${{ matrix.cfg }}-${{ matrix.attempt }}]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cfg: default
            jvm_opt: ""
            attempt: 1
          - cfg: default
            jvm_opt: ""
            attempt: 2
          - cfg: software
            jvm_opt: "--test_env=SKIKO_RENDER_API=SOFTWARE_FAST"
            attempt: 1
          - cfg: software
            jvm_opt: "--test_env=SKIKO_RENDER_API=SOFTWARE_FAST"
            attempt: 2
          - cfg: software
            jvm_opt: "--test_env=SKIKO_RENDER_API=SOFTWARE_FAST"
            attempt: 3
          - cfg: software
            jvm_opt: "--test_env=SKIKO_RENDER_API=SOFTWARE_FAST"
            attempt: 4
          - cfg: software
            jvm_opt: "--test_env=SKIKO_RENDER_API=SOFTWARE_FAST"
            attempt: 5
          - cfg: software
            jvm_opt: "--test_env=SKIKO_RENDER_API=SOFTWARE_FAST"
            attempt: 6
          - cfg: software
            jvm_opt: "--test_env=SKIKO_RENDER_API=SOFTWARE_FAST"
            attempt: 7
          - cfg: software
            jvm_opt: "--test_env=SKIKO_RENDER_API=SOFTWARE_FAST"
            attempt: 8
          - cfg: software
            jvm_opt: "--test_env=SKIKO_RENDER_API=SOFTWARE_FAST"
            attempt: 9
          - cfg: software
            jvm_opt: "--test_env=SKIKO_RENDER_API=SOFTWARE_FAST"
            attempt: 10
          - cfg: software
            jvm_opt: "--test_env=SKIKO_RENDER_API=SOFTWARE_FAST"
            attempt: 11
          - cfg: software
            jvm_opt: "--test_env=SKIKO_RENDER_API=SOFTWARE_FAST"
            attempt: 12
          - cfg: software
            jvm_opt: "--test_env=SKIKO_RENDER_API=SOFTWARE_FAST"
            attempt: 13
          - cfg: software
            jvm_opt: "--test_env=SKIKO_RENDER_API=SOFTWARE_FAST"
            attempt: 14
          - cfg: software
            jvm_opt: "--test_env=SKIKO_RENDER_API=SOFTWARE_FAST"
            attempt: 15
          - cfg: software
            jvm_opt: "--test_env=SKIKO_RENDER_API=SOFTWARE_FAST"
            attempt: 16
          - cfg: software
            jvm_opt: "--test_env=SKIKO_RENDER_API=SOFTWARE_FAST"
            attempt: 17
          - cfg: software
            jvm_opt: "--test_env=SKIKO_RENDER_API=SOFTWARE_FAST"
            attempt: 18
          - cfg: software
            jvm_opt: "--test_env=SKIKO_RENDER_API=SOFTWARE_FAST"
            attempt: 19
          - cfg: software
            jvm_opt: "--test_env=SKIKO_RENDER_API=SOFTWARE_FAST"
            attempt: 20
    defaults:
      run:
        working-directory: .

    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v7.0.1
        name: Check out repository

      - uses: actions/checkout@v7.0.1
        name: Checkout JetBrains/android submodule
        with:
          repository: JetBrains/android
          path: android
          ref: master

      - name: Put Bazel's output on the larger drive
        shell: pwsh
        run: |
          @(
            "startup --output_user_root=D:/b"
            "startup:windows --output_user_root=D:/b"
            "common --disk_cache=D:/bc"
            "common:windows --disk_cache=D:/bc"
          ) | Out-File -Encoding ascii .bazelrc-user.bazelrc
          Get-PSDrive C, D | Format-Table Name, Used, Free

      - name: Run the Spectre headful UI tests
        env:
          JEWEL_DIAG_ORDER: pre1485
        run: >
          ./bazel.cmd test //platform/jewel/...
          --build_tests_only
          --test_tag_filters=requires-display,-jewel-ide-e2e
          --test_env=JEWEL_DIAG_ORDER
          ${{ matrix.jvm_opt }}
          --test_output=all

      - name: Upload Bazel test logs
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: spectre-test-logs-windows-${{ matrix.cfg }}-${{ matrix.attempt }}
          path: out/bazel-testlogs/platform/jewel/**
          retention-days: 7
          if-no-files-found: ignore
